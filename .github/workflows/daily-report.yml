name: Daily Traffic Report (21:00 PDT)
# 云端每日达成汇报：浏览量 / 环比增长 / 增长来源。不依赖本机设备 / WorkBuddy。
# 投递优先级：163 邮件（主）→ 飞书 → Resend。
# 时区：21:00 PDT = 次日 04:00 UTC。
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -q google-api-python-client google-analytics-data
      - name: Check secret presence (masked — shows only true/false)
        # 不泄漏明文：用 secrets.X != '' 比较，GitHub 只回 true/false
        env:
          HAS_SA: ${{ secrets.GSC_SA_JSON != '' }}
          HAS_PID: ${{ secrets.GA4_PROPERTY_ID != '' }}
          HAS_DK: ${{ secrets.DEEPSEEK_API_KEY != '' }}
          HAS_SMTP: ${{ secrets.SMTP_PASS != '' }}
          HAS_USER: ${{ secrets.SMTP_USER != '' }}
        run: |
          echo "GSC_SA_JSON        present : $HAS_SA"
          echo "GA4_PROPERTY_ID    present : $HAS_PID"
          echo "DEEPSEEK_API_KEY   present : $HAS_DK"
          echo "SMTP_PASS          present : $HAS_SMTP"
          echo "SMTP_USER          present : $HAS_USER"
      - name: Materialize secrets to files
        # 文件名必须与 scripts/*.py 里的 SA_JSON 常量完全一致：gsc-ga4-service-account.json
        # （历史 bug：这里曾写成 gcs-...，导致脚本永远找不到凭据而静默降级）
        env:
          GSC_SA_JSON: ${{ secrets.GSC_SA_JSON }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
        run: |
          if [ -n "$GSC_SA_JSON" ]; then
            printf '%s\n' "$GSC_SA_JSON" > gsc-ga4-service-account.json
            echo "wrote gsc-ga4-service-account.json ($(wc -c < gsc-ga4-service-account.json) bytes)"
          else
            echo "::warning::Secret GSC_SA_JSON is EMPTY at runtime — 报表将降级为静态快照口径"
          fi
          if [ -n "$GA4_PROPERTY_ID" ]; then
            printf '%s\n' "$GA4_PROPERTY_ID" > ga4-property-id.txt
            echo "wrote ga4-property-id.txt ($(wc -c < ga4-property-id.txt) bytes)"
          else
            echo "::warning::Secret GA4_PROPERTY_ID is EMPTY at runtime — 报表将降级为静态快照口径"
          fi
      - name: Verify credentials (loud failure instead of silent degradation)
        # 只在「Secret 有值但文件不可用」时报错（配置 bug 必须立刻暴露）；
        # Secret 本就为空仅告警，保留 CSV/sitemap 降级能力。纯本地校验，不联网。
        env:
          HAS_SA: ${{ secrets.GSC_SA_JSON != '' }}
          HAS_PID: ${{ secrets.GA4_PROPERTY_ID != '' }}
        run: python scripts/check_credentials.py
      - name: Run daily report
        run: python scripts/daily_report.py
      - name: Deliver (email primary)
        if: always()
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.163.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '465' }}
          SMTP_SSL: "true"
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          REPORT_TO: ${{ secrets.REPORT_TO || 'mireia1998@163.com' }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
        run: |
          F=$(ls daily-*.md 2>/dev/null | head -1)
          if [ -z "$F" ]; then
            {
              echo "# 每日达成汇报缺失"
              echo
              echo "- 运行状态：${{ job.status }}"
              echo "- daily_report.py 未产出 daily-*.md。按下面顺序排查："
              echo "  1. 若运行是红色：看 **Verify credentials** 步骤的报错行（凭据文件没落地 / JSON 非法 / 属性 ID 不是纯数字），这是最常见的现在原因。"
              echo "  2. 若凭据自检通过仍是降级口径：看 **Check secret presence** 步骤，确认 GSC_SA_JSON / GA4_PROPERTY_ID 是否 true。"
              echo "  3. 都正常：查 GA4/GSC 配额或服务账号权限（GA4 需 Viewer、GSC 需受限用户）。"
            } > /tmp/daily-fallback.md
            F=/tmp/daily-fallback.md
          fi
          python scripts/deliver.py "$F" "【powerbitutorials】每日达成 $(date -u +%F)"
