name: One-off SEO fixes (2026-11)

# 一次性工作流：跑 scripts/apply-seo-fixes-2026-11.mjs，用真实的 npm run
# check:seo 验收，通过后把这个脚本和本文件一起删掉再提交。
# 也就是说分支上留下的是修复结果，不是这套临时机制。

on:
  push:
    branches: [seo-funnel-2026-11]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: seo-funnel-2026-11

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Apply patch
        run: node scripts/apply-seo-fixes-2026-11.mjs

      - name: Guard (npm run check:seo)
        run: |
          set +e
          npm run check:seo > /tmp/seo.txt 2>&1
          code=$?
          cat /tmp/seo.txt
          set -e
          if [ "$code" -ne 0 ]; then
            echo "::error::check:seo 仍然失败，改动不提交"
            exit 1
          fi

      - name: Commit
        run: |
          git config user.name "powerbitutorials-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm -q scripts/apply-seo-fixes-2026-11.mjs .github/workflows/_seo-fixes.yml
          git add -A
          git commit -m "fix(seo): shorten 13 over-long titles, widen FAQ schema, disclose the newsletter, wire IndexNow to consts"
          git push origin HEAD:seo-funnel-2026-11
