name: Weekly Traffic Review (Mon 09:00 PDT)
# 云端每周复盘 + 告警。不依赖本机设备 / WorkBuddy。
# 投递优先级：163 邮件（主）→ 飞书 → Resend。
# 时区：周一 09:00 PDT = 16:00 UTC。
on:
  schedule:
    - cron: "0 16 * * 1"
  workflow_dispatch:
jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -q google-api-python-client google-analytics-data
      - name: Materialize secrets to files
        env:
          GSC_SA_JSON: ${{ secrets.GSC_SA_JSON }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
        run: |
          [ -n "$GSC_SA_JSON" ] && echo "$GSC_SA_JSON" > gcs-ga4-service-account.json
          [ -n "$GA4_PROPERTY_ID" ] && echo "$GA4_PROPERTY_ID" > ga4-property-id.txt
          exit 0
      - name: Run weekly review
        run: python scripts/weekly_review.py
      - name: Deliver (email primary)
        if: always()
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.163.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '465' }}
          SMTP_SSL: "true"
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          REPORT_TO: ${{ secrets.REPORT_TO || 'mireia1998@163.com' }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
        run: |
          F=$(ls review-*.md 2>/dev/null | head -1)
          if [ -z "$F" ]; then
            {
              echo "# 周复盘缺失"
              echo
              echo "- 运行状态：${{ job.status }}"
              echo "- weekly_review.py 未产出 review-*.md，请查看 Actions 日志。"
            } > /tmp/review-fallback.md
            F=/tmp/review-fallback.md
          fi
          python scripts/deliver.py "$F" "【powerbitutorials】周复盘 $(date -u +%F)"
