name: Daily subscriber check

# 每天早上检查 Buttondown 有没有新订阅者。
# 这个站一个月可能只来几十个订阅，没人会天天登录后台看 —— 没有通知就等于
# 「有人订阅了但没人知道」。所以有新增时发邮件，没有就静默。

on:
  schedule:
    # 09:00 Asia/Taipei = 01:00 UTC
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check subscribers
        id: check
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: |
          set +e
          OUT=$(python scripts/check_subscribers.py 2>&1)
          CODE=$?
          echo "$OUT"
          echo "$OUT" >> "$GITHUB_STEP_SUMMARY"
          if [ $CODE -ne 0 ]; then
            echo "::error::订阅者检查失败（exit $CODE）"
            exit $CODE
          fi
          if echo "$OUT" | grep -q "^NEW_SUBSCRIBERS=1"; then
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "fresh=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Email only when someone subscribed
        if: steps.check.outputs.fresh == 'true'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.163.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '465' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          REPORT_TO: ${{ secrets.REPORT_TO || 'mireia1998@163.com' }}
        run: |
          if [ -z "$SMTP_PASS" ]; then
            echo "::warning::SMTP 未配置，跳过邮件；新订阅者信息在上方 Step Summary 里"
            exit 0
          fi
          {
            echo "Subject: 【powerbitutorials】有人订阅了"
            echo "MIME-Version: 1.0"
            echo "Content-Type: text/plain; charset=UTF-8"
            echo ""
            python scripts/check_subscribers.py 2>/dev/null | sed 's/^#* //'
          } > /tmp/mail.txt

          python - <<'PY'
          import os, smtplib, ssl
          from email.message import EmailMessage
          msg = EmailMessage()
          body = open("/tmp/mail.txt", encoding="utf-8").read()
          msg["Subject"] = "【powerbitutorials】有人订阅了"
          msg["From"] = os.environ.get("SMTP_FROM") or os.environ["SMTP_USER"]
          msg["To"] = os.environ.get("REPORT_TO", "mireia1998@163.com")
          msg.set_content(body.split("\n\n", 1)[-1])
          host = os.environ.get("SMTP_HOST", "smtp.163.com")
          port = int(os.environ.get("SMTP_PORT", "465"))
          ctx = ssl.create_default_context()
          with smtplib.SMTP_SSL(host, port, context=ctx) as s:
              s.login(os.environ["SMTP_USER"], os.environ["SMTP_PASS"])
              s.send_message(msg)
          print("mail sent")
          PY
