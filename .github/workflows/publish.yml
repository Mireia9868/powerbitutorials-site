name: Publish Power BI Tutorials (Daily)
# 云端定时生成 + 发布，不依赖本机设备 / WorkBuddy 是否运行。
# LLM：DeepSeek（deepseek-chat 生成 / deepseek-reasoner 审稿，构成"另一个 AI"复核）
# 时区：GitHub Actions 为 UTC。08:00 PDT = 15:00 UTC。
on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          if [ "${{ secrets.LLM_PROVIDER || 'deepseek' }}" = "anthropic" ]; then
            pip install -q anthropic
          else
            pip install -q openai
          fi
      - name: Check secret presence (masked — shows only true/false)
        env:
          HAS_DK: ${{ secrets.DEEPSEEK_API_KEY != '' }}
          HAS_SA: ${{ secrets.GSC_SA_JSON != '' }}
          HAS_PID: ${{ secrets.GA4_PROPERTY_ID != '' }}
          HAS_SMTP: ${{ secrets.SMTP_PASS != '' }}
        run: |
          echo "DEEPSEEK_API_KEY   present : $HAS_DK"
          echo "GSC_SA_JSON        present : $HAS_SA"
          echo "GA4_PROPERTY_ID    present : $HAS_PID"
          echo "SMTP_PASS          present : $HAS_SMTP"
      - name: Generate + review drafts
        env:
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER || 'deepseek' }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || 'deepseek-chat' }}
          REVIEW_MODEL: ${{ secrets.REVIEW_MODEL || 'deepseek-reasoner' }}
          AUTO_PUBLISH: "false"
        run: python scripts/generate_article.py
      - name: Validate drafts (拦掉会让 Astro 构建失败的稿件)
        # 失败 = 不提交、保留已生成文件供人工查看，并触发出告警邮件（Notify 步骤为 always）
        run: python scripts/validate_content.py --changed
      - name: Commit & push new articles
        run: |
          git config user.email "bot@powerbitutorials.com"
          git config user.name "Content Bot"
          git add src/content/tutorials/ .article-reviews/
          git commit -m "auto: publish tutorials $(date +%F)" || echo "nothing to commit"
          git push
      - name: Notify (email primary)
        if: always()
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.163.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '465' }}
          SMTP_SSL: "true"
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          REPORT_TO: ${{ secrets.REPORT_TO || 'mireia1998@163.com' }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
        run: |
          {
            echo "# powerbitutorials 自动发布"
            echo
            echo "- 运行状态：${{ job.status }}"
            echo "- 时间(UTC)：$(date -u +'%F %H:%M')"
            echo
            echo "## 本次提交"
            echo '```'
            git log -1 --pretty=format:'%h %s' || true
            echo
            echo '```'
            echo
            echo "## 文件变更"
            echo '```'
            git show --stat --oneline HEAD 2>/dev/null | sed -n '1,40p' || true
            echo '```'
          } > /tmp/pubnote.md
          python scripts/deliver.py /tmp/pubnote.md "【powerbitutorials】自动发布 $(date -u +%F)"
